member_growth_driven = false
funding_attracted_by_members = false
exits_or_success_stories = false

member_feedback = "Unknown"
nps_score = "Unknown"
member_satisfaction = "Unknown"

[cluster.challenges]
known_issues = [
  "Issue 1",
  "Issue 2"
]

data_quality_issues = [
  "Data freshness: Unknown / Stale / Unknown update mechanism"
]

engagement_issues = [
  "Unknown member engagement levels"
]

communication_gaps = [
  "Gap 1 between claimed services and actual delivery"
]

[cluster.opportunities]
# What they COULD do to add more value

with_fresh_member_data = [
  "Implement real-time matching algorithm",
  "Create sector-specific sub-groups",
  "Build lead generation dashboard",
  "Create targeted partnership opportunities",
  "Develop tier-based membership",
  "Investor matchmaking with live data"
]

improvement_areas = [
  "Area 1",
  "Area 2"
]

market_gaps = [
  "Gap 1",
  "Gap 2"
]

[cluster.competitive_landscape]
# Prefer array-of-tables for competitor records (safer to edit than inline tables).
[[cluster.competitive_landscape.direct_competitor]]
name = "Competitor 1"
location = "City"
focus = "Description"

# Add more direct competitors by adding additional [[cluster.competitive_landscape.direct_competitor]] blocks

[[cluster.competitive_landscape.indirect_competitor]]
name = "Competitor 1"
location = "City"
focus = "Description"

market_positioning = "Description of how they differentiate"

market_saturation = "High/Medium/Low"

