name: maps_of_making

services:

  # ─────────────────────────────────────────────────────────────────
  # maps-nginx — serves static web/ files, proxies /sparql → oxigraph
  # Joins the shared gateway network so hetzner-gateway can reach it.
  # ─────────────────────────────────────────────────────────────────
  maps-nginx:
    image: nginx:alpine
    container_name: maps-nginx
    restart: unless-stopped
    networks:
      - gateway
      - internal
    volumes:
      - ../web:/var/www/mapsofmaking:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../data/logs/nginx:/var/log/nginx
      - /etc/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────
  # oxigraph — SPARQL 1.1 triplestore
  # Persists RDF data in data/oxigraph/ (bind-mounted from VPS host).
  # Internal only — access via nginx proxy on VPS.
  # ─────────────────────────────────────────────────────────────────
  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    container_name: maps-oxigraph
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ../data/oxigraph:/data
    expose:
      - "7878"
    command: serve --location /data --bind 0.0.0.0:7878
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────
  # mak-agent — Nanobot NL bot (deferred to Epic 6)
  # Build from source: https://github.com/HKUDS/nanobot
  # Run as a SEPARATE compose project joining maps_of_making_internal.
  # Do NOT embed here — kept as separate project for clean isolation.
  # ─────────────────────────────────────────────────────────────────
  # mak-agent:
  #   image: hkuds/nanobot:local   # build from HKUDS/nanobot repo
  #   container_name: maps-agent
  #   restart: unless-stopped
  #   networks:
  #     - internal
  #   environment:
  #     - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
  #     - OXIGRAPH_ENDPOINT=http://oxigraph:7878
  #   volumes:
  #     - ./nanobot-config:/root/.nanobot:z
  #     - ./tasks:/app/tasks:z
  #   depends_on:
  #     - oxigraph

  # ─────────────────────────────────────────────────────────────────
  # mak-link-handler — FastAPI magic link validator & claim handler
  # Processes /claim/{token} requests (full impl in Epic 3 Story 3.3).
  # ─────────────────────────────────────────────────────────────────
  mak-link-handler:
    build: ./link_handler
    container_name: maps-link-handler
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8000"
    environment:
      - OXIGRAPH_ENDPOINT=http://oxigraph:7878
      - LINK_SECRET=${LINK_SECRET:?LINK_SECRET must be set in .env}
    depends_on:
      oxigraph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  gateway:
    external: true        # shared with hetzner-gateway
  internal:
    driver: bridge        # maps-nginx ↔ oxigraph, mak-agent, mak-link-handler
