# Local dev overrides — NOT for VPS deployment
# Usage: podman compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Isolation note: On Fedora/distrobox, hetzner-gateway network doesn't exist locally.
# This override removes the gateway network dependency and exposes ports directly.
# On VPS (Ubuntu), use docker-compose.yml alone — gateway handles routing.

services:
  maps-nginx:
    networks:
      - internal    # drop gateway network (doesn't exist locally)
    ports:
      - "8080:80"
    volumes:
      - ../web:/var/www/mapsofmaking:ro,z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,z
      - ../data/logs/nginx:/var/log/nginx:z
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro,z

  oxigraph:
    ports:
      - "7878:7878"
    volumes:
      - ../data/oxigraph:/data:z

networks:
  gateway:
    external: false   # override: create locally instead of requiring hetzner-gateway
