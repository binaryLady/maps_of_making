# =============================================================================
# SERVICE: Maps of Making — main map
# DOMAIN: mapsofmaking.org (primary), mapsofmaking.com (redirects to .org)
# PURPOSE: TLS termination + reverse proxy to maps-nginx container
# ADDED: 2026-04-21 (debarquin.eu legacy domain removed 2026-05-27)
# SSL: Let's Encrypt — certbot certonly --webroot -w /var/www/certbot
#        -d mapsofmaking.org -d mapsofmaking.com
# DNS: A records mapsofmaking.org / mapsofmaking.com → <VPS IP>
# BACKEND: maps-nginx container (joins gateway Docker network)
# =============================================================================

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen      80;
    listen [::]:80;
    server_name mapsofmaking.org mapsofmaking.com;

    access_log /var/log/nginx/mapsofmaking_http_access.log combined;
    error_log  /var/log/nginx/mapsofmaking_error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
# Redirect .com → .org (canonical)
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name mapsofmaking.com;

    http2 on;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/mapsofmaking.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mapsofmaking.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mapsofmaking_https_access.log combined;
    error_log  /var/log/nginx/mapsofmaking_error.log;

    return 301 https://mapsofmaking.org$request_uri;
}

# Primary production domain
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name mapsofmaking.org;

    http2 on;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/mapsofmaking.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mapsofmaking.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "ALLOWALL" always;
    add_header Content-Security-Policy "frame-ancestors *" always;

    access_log /var/log/nginx/mapsofmaking_https_access.log combined;
    error_log  /var/log/nginx/mapsofmaking_error.log;

    location / {
        set $upstream http://maps-nginx:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
