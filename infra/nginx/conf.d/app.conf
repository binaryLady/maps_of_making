# =============================================================================
# Maps of Making — internal nginx
# Serves static files from web/ and proxies SPARQL to oxigraph.
# This nginx sits behind hetzner-gateway; no TLS needed here.
# =============================================================================

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    access_log /var/log/nginx/maps_access.log combined;
    error_log  /var/log/nginx/maps_error.log;

    # ── Static map app ───────────────────────────────────────────────────────
    root  /var/www/mapsofmaking;
    index maps-of-making.html;

    location / {
        try_files $uri $uri/ =404;
        # PMTiles: range requests required by MapLibre PMTiles protocol
        add_header Accept-Ranges bytes always;
    }

    # ── SPARQL endpoint (Oxigraph) ───────────────────────────────────────────
    location /sparql {
        proxy_pass http://oxigraph:7878/query;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── Admin area (Phase 2) ─────────────────────────────────────────────────
    # Will serve a separate SPA or static page routed from admin.debarquin.eu
    location /admin {
        try_files $uri $uri/ /admin/index.html =404;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
