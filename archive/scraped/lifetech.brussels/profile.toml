[cluster]
name = "lifetech.brussels"
tagline = "innovate further, care better"
website = "https://lifetech.brussels"
parent_organization = "hub.brussels"
location = "Brussels, Belgium"
region = "Belgium - Brussels Region"
established = "Unknown"
contact_address = "Chaussée de Charleroi 110, 1060 Bruxelles"
contact_phone = "02 422 00 20"

[cluster.mission]
statement = "Amplify and de-risk the development and market adoption of health solutions with societal impact"
gateway_description = "Gateway to all the key players in the Brussels health innovation ecosystem"
target_sectors = ["Medtech", "eHealth", "Biotech", "Healthcare", "Life Sciences"]

[cluster.vision]
description = "Drive innovation in the healthcare sector by facilitating synergies between businesses, public entities, and academia"
social_focus = true
goals = [
  "Contribute to a healthier society",
  "Make healthcare a driver of societal impact",
  "Foster ecosystem collaboration"
]

[cluster.members]
