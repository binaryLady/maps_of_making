# Bernard's bot-side voice strings (harness/). Full voice audit is Story 6.5 —
# this file only carries the graceful-ack path needed for `!mom ping` /
# `unknown` intent. Register: dry, terse, no exclamation marks, never a raw
# error/status code, never "I cannot help". [bernard-bible.md §3]

bot:
  ping_ack: "Still on watch. Send me something to do."
  unknown_ack: "Not sure what you're after there — try asking about a space, or registering one."
  link_tutorial: "Here's your key.\n\n{tutorial}"
  link_failed_ack: "I couldn't generate a key for that space — check the space slug is registered, then try again."
  no_deploy_key_ack: "I can read your profile but I can't edit it yet — run `!mom link` first so I get write access."
  update_failed_ack: "That update didn't go through — check the field path and value, then try again."
  update_succeeded_ack: "Done. Committed as {sha}."

  # Commit + CDN flow
  update_committed_ack: "Saved — committed as {sha}. Waiting for CDN to propagate before the map updates…"
  propagation_confirmed_ack: "Map updated. {refresh_note} You may need to hard-refresh your browser to see the change."
  propagation_timeout_ack: "Commit {sha} landed but CDN hasn't propagated after 10 minutes — the map will catch up on its own. Hard-refresh when you see it."

  # Open/close shorthands
  open_ack: "Marked as open — committed as {sha}. Waiting for CDN propagation…"
  close_ack: "Marked as closed — committed as {sha}. Waiting for CDN propagation…"

  # Permission refusals
  read_only_ack: "That's a write command — only the space coordinator (power level 100) can make changes. You can ask them to run it, or ask me anything about the space."
  field_not_allowed_ack: "That field isn't editable through me. Fields I can update: {fields}."

  # Value validation
  invalid_bool_ack: "state.open needs to be `true`, `false`, or `null` (to opt out). Example: `!mom update state.open true`"
  invalid_matrix_id_ack: "contact.matrix should look like `@username:server`. Example: `!mom update contact.matrix @atelier:matrix.org`"

  # Setup / status
  status_ok_ack: "Everything looks set up.\n• Remote: {remote}\n• Branch: {branch}\n• File: {file_path}\n\nNote: read access confirmed; write access will be confirmed on your first commit."
  status_error_ack: "Setup check found {n} issue(s):\n{errors}\nRun `!mom link` to fix the key or re-register with the correct URL."

  query_failed_ack: "Couldn't reach the directory right now — try again in a moment."

  # Query responses
  status_no_link_ack: "This room isn't linked to a space yet. Register one with `!mom link {slug}` first."
  status_lifecycle: "**{name}** · {state_line}\nLast updated: {updated_at}\n{unlock_line}"
  hours_found: "**{name}** opens: {hours}"
  hours_missing: "**{name}** hasn't listed opening hours yet."
  find_results: "Found {count} confirmed space(s) matching '{tag}' in {city}:\n{list}"
  find_empty: "No confirmed spaces match '{tag}' in {city}. {seeded_note}"
  nearby_results: "Within {radius}km of {city} — {count} confirmed space(s):\n{list}"
  nearby_empty: "Nothing confirmed within {radius}km of {city}. {seeded_note}"
  network_results: "**{network}** — {count} confirmed member(s):\n{list}"
  network_empty: "No confirmed spaces list '{network}' as a network. Check the exact name."
  travel_results: "Within {hours} of {origin} by {mode} — {count} confirmed space(s):\n{list}\n{seeded_note}"
  travel_timeout: "ORS took too long — falling back to a bounding box. {fallback_result}"
  travel_ors_unavailable: "Travel search is temporarily unavailable. {fallback_result}"
  seeded_note: "{count} seeded space(s) also fall in range — they haven't registered an endpoint yet."
  # Help and fuzzy-suggest
  help_header: "Here's what I do."
  did_you_mean: "There's no `{verb}`. Did you mean `!mom {suggestion}`?"
  unknown_command: "I don't know `{verb}`. Try `!mom help`."
  result_cap_note: "Showing first {n} — use `!mom find` with a tag and city to narrow down."
  # @bernard mention stub (NL deferred to 6.4)
  bernard_nl_stub: "Natural-language questions are on the roadmap. For now: `!mom help` lists what I can do."
