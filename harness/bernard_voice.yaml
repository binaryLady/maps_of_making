# Bernard's bot-side voice strings (harness/). Full voice audit is Story 6.5 —
# this file only carries the graceful-ack path needed for `!mom ping` /
# `unknown` intent. Register: dry, terse, no exclamation marks, never a raw
# error/status code, never "I cannot help". [bernard-bible.md §3]

bot:
  ping_ack: "Still on watch. Send me something to do."
  unknown_ack: "Not sure what you're after there — try asking about a space, or registering one."
  link_tutorial: "Here's your key.\n\n{tutorial}"
  link_failed_ack: "I couldn't generate a key for that space — check the space slug is registered, then try again."
  no_deploy_key_ack: "I can read your profile but I can't edit it yet — run `!mom link {space}` first so I get write access."
  update_failed_ack: "That update didn't go through — check the field path and value, then try again."
  update_succeeded_ack: "Done. Committed as {sha}."
