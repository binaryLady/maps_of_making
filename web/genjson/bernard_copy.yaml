# ============================================================================
# bernard_copy.yaml — Bernard's voice artifact (SOURCE OF TRUTH)
# ============================================================================
# This YAML is the hand-edited source. The runtime consumes the GENERATED
# JSON, never this file:
#   - genjson.js does `fetch('/bernard_copy.json')` at startup.
#   - Regenerate after every edit:  make bernard-copy
#   - deploy-genjson runs `make bernard-copy` before rsync (JSON always fresh).
# Edit here, never edit bernard_copy.json by hand — it gets overwritten.
#
# Why a separate YAML when JSON is legible? This file can carry the comments
# below (voice rules, conventions) that JSON can't, and is the natural home
# for richer copy as the wizard form gives way to the planned chatbot — same
# keyed utterances, room to grow per-key metadata the runtime JSON won't need.
#
# ---- VOICE RULES (bernard-bible.md §3 — cross-check before editing) --------
# Register: "Ron Swanson on a North Sea fort, with notes of Dredge."
#   maintenance-log voice, salvaged-typewriter — weathered, dry, terse.
#   DO:  short sentences; no exclamation marks; observation over explanation;
#        state what's valid, state what's broken, name consequences.
#   DON'T (forbidden patterns — test_bernard_voice_completeness.py enforces):
#        "most spaces leave this blank", "keep it simple", "you can do better",
#        any nudge that comforts mediocrity OR shames, any ranking of choices.
#
# ---- CONVENTIONS -----------------------------------------------------------
# Em-dash (—): Bernard's SPOKEN lines open with an em-dash (Dredge convention).
#   It is NOT stored here — the JS prepends it to spoken lines only
#   (wizard_intro, floor_gate, tier_*_exit, localstorage_warning). Field hints
#   and validation_messages are NOT Bernard speaking → no em-dash, flat/system
#   voice.
# Field hints: don't restate the label (the label already says "Logo URL" etc.).
# drawer_one_liner: documentation only — the drawer (maps-of-making.html) is
#   static and hardcodes its own copy; it does NOT fetch this artifact. Kept
#   here so all Bernard copy lives in one place.
# ============================================================================

drawer_one_liner: "Two ways onto the map. Tell me about your space, or paste your endpoint URL if you've got one. Either's fine."
wizard_intro: "Hi, I'm Bernard (they/them) from 'Mother Sands'. Let's get your space on the map."
floor_gate: "Let's define your bedrock. What does your community call this place?"  # TONE-REVIEW (Story 9.12): trimmed to a name-first opener — no longer pre-announces the address beat
beat_name_ack: "Okay, and where do I find it?"  # TONE-REVIEW (Story 9.12): spoken, reveals with the location beat (P4 acknowledgment-not-congratulations)
bedrock_confirm: "That's your bedrock. The rest is yours to give, or not."  # TONE-REVIEW (Story 9.12): spoken, reveals with the bedrock beat (P1 ownership)
keyboard_nav_hint: "Tab or Enter to move on."  # TONE-REVIEW (Story 9.12): SYSTEM voice (no em-dash) — surfaces the commit-to-advance affordance so it's expected
tier_1_exit: "Core's in. Other SpaceAPI apps can read this file as-is."
tier_2_exit: "MoM fields in. Now the world can see your membership, your hours, the goals you work toward."
tier_3_exit: "Silo fields in. The bits only your kind of space needs are switched on."
sovereignty_disclosure: "You publish, we make it legible. The rest is history."
localstorage_warning: "Your progress is saved in this browser. Hard-refresh or clearing site data wipes it. Export at any point if you want a copy outside the browser."
localstorage_resume: "Continuing from where you left off."
field_hints:
  space: "The name your community knows you by."
  address: "Street address — the part before city."
  city: "City or municipality."
  postcode: "Postal code."
  country_code: "Two-letter ISO country code. e.g. DE, FR, BE."
  logo: "We scale by height and keep your ratio — transparent PNG works best."
  url: "Your space's main web page."
  description: "One or two sentences. What kind of space is this?"
  contact_email: "Not a personal inbox — somewhere the space can be reached."
  contact_matrix: "Your space's room, not a personal account."
  opening_hours: "When are you open? We use OSM opening_hours format."
  memberOf: "Which network(s) is this space part of? URL preferred."
  sdgs: "Which UN Sustainable Development Goals does your space contribute to? Numbers only."
validation_messages:
  schema_invalid: "Something's off. Check the fields marked in red — the file isn't valid yet."
  geocoding_in_progress: "Working out where that is."  # TONE-REVIEW (Story 9.12): geocode "doing the math" beat
  geocode_resolved: "Dropping the pin here:"           # TONE-REVIEW (Story 9.12): prefix before the green lat/long
  nominatim_unavailable: "Geocoding temporarily unavailable — enter coordinates manually."
  nominatim_no_result: "No result — enter coordinates manually."
  nominatim_rate_limit: "Too many requests — wait a moment and try again."
  clear_confirm: "This will erase your saved progress. Continue?"
  url_scheme_added: "Added https:// — update if wrong."
  matrix_sigil_added: "Added # for a room — change to + if it's a community."
export_button: "Export JSON"  # TONE-REVIEW (Story 9.12): strip always-on export label — system voice, not Bernard
fork_stub:
  tier2_teaser: "Tier 2 is on the way. Network features land in a later step."
tutorial:
  # Story 9.8 — GitLab go-live walkthrough. Revealed beat-by-beat under "Go live →".
  # All lines Bernard spoken (em-dash prepended by JS). trigger orients above the
  # first beat; steps 2-5 OPEN with a terse reaction to the step just completed
  # (P4 acknowledgment, never congratulation), then state the next action — this
  # is the "Bernard reacts before the next reveals" beat seam.
  trigger: "You've got the file. Now it needs an address. GitLab will give you one, free, permanently, in about five minutes. No credit card. No server. No command line."
  step1: "Create a free account at gitlab.com. Email or SSO — your call. Verify your address when they ask."
  step2: "Account's yours. New project → Create blank project. Set the Visibility Level to Public — the map reads your file without a login. Any name works."
  step3: "Project's up. Hit the + button → Upload file. Drop in your exported JSON, click Commit changes — that saves it to the repository."
  step4: "It's hosted. Open the file, click Open raw (top-right). The URL in your browser's address bar is your permanent endpoint — copy it. That's the address the map reads."
  step5: "Last move, back on the map: 'Add your space', then the endpoint URL path. Paste your raw URL into 'Your Endpoint URL', hit Fetch & validate. The map checks reachability, format, and coordinates."
  closing: "That 'paste your endpoint URL' line back on the map? It's for you now."
  next: "Done →"   # advance affordance — system voice, no em-dash
