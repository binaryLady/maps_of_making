<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embed test — Maps of Making</title>
  <style>
    body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f0; color: #1a1a1a; }
    h1 { font-size: 1.2rem; margin-bottom: 0.25rem; }
    p { font-size: 0.85rem; color: #555; margin: 0 0 0.75rem; }
    iframe { border: 1.5px solid #1a1a1a; width: 100%; height: 520px; display: block; margin: 0 0 2rem; }
    .label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin: 1.5rem 0 0.25rem; }
  </style>
</head>
<body>
  <h1>Maps of Making — embed test page</h1>
  <p>Vanilla host page simulating a third-party site embedding the map. Used to validate iframe layout, CORS, and responsive behaviour before production deploy.</p>

  <div class="label">Full width iframe (520px height)</div>
  <iframe src="maps-of-making.html"
          title="Maps of Making"
          loading="lazy"
          allow="geolocation"></iframe>

  <div class="label">Narrow column (480px wide)</div>
  <iframe src="maps-of-making.html"
          title="Maps of Making — narrow"
          loading="lazy"
          style="max-width:480px;height:400px"></iframe>
</body>
</html>
